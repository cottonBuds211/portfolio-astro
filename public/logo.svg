<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradient definition matching light blue to purple/violet -->
    <linearGradient id="mdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38b6ff"/>
      <stop offset="45%" stop-color="#4c8cf5"/>
      <stop offset="100%" stop-color="#9d63f2"/>
    </linearGradient>
  </defs>

  <!-- SVG Text rendering for precise font reproduction -->
  <text 
    x="250" 
    y="360" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="280" 
    font-weight="800" 
    letter-spacing="-5" 
    text-anchor="middle" 
    fill="url(#mdGradient)">MD</text>
</svg>
